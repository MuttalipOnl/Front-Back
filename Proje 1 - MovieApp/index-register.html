<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="Css/style.css" />
    <link rel="stylesheet" href="Css/forms.css" />
  </head>
  <body id="body">
    <header class="main-header">
      <div class="container">
        <a href="#" class="main-header__logo">MovieApp</a>
        <nav class="main-nav">
          <ul class="main-nav__items">
            <li class="main-nav__item">
              <a href="#">Filmler</a>
            </li>
            <li class="main-nav__item">
              <a href="#">Diziler</a>
            </li>
            <li class="main-nav__item main-nav__item--login">
              <a class="btn btn-secondary" href="#">Login</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="signup-page">
      <div class="container">
        <h1 class="signup-title">Creat Your Account</h1>
        <form action="" class="signup-form">
          <label for="firstname">First Name: </label>
          <input type="text" id="firstname" placeholder="First Name" required />

          <label for="lastname">Last Name: </label>
          <input type="text" id="lastname" placeholder="Last Name" required />

          <label for="email">E-mail: </label>
          <input type="email" id="email" placeholder="E-mail" required />

          <label for="password">Password: </label>
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />

          <label for="gender">Gender</label>
          <select id="Gender">
            <option value="">Select</option>
            <option value="">Kadın</option>
            <option value="">Erkek</option>
          </select>

          <input type="checkbox" id="agree-terms" />
          <label for="agree-terms"
            >Agree to <a href="#">Terms &amp; Conditions</a>
          </label>

          <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>
      </div>
    </main>
    <footer>
      <div class="container">
        <div class="row">
          <div class="col-2 yaz">
            <ul iid="footer-links">
              <li><a href="#">About Us</a></li>
              <li><a href="#">Blog</a></li>
              <li><a href="#">Forum</a></li>
              <li><a href="#">Contact Us</a></li>
            </ul>
          </div>
          <div class="col-2">
            <ul id="social-links">
              <li><a href="" class="fab fa-facebook"></a></li>
              <li><a href="" class="fab fa-twitter"></a></li>
              <li><a href="" class="fab fa-instagram"></a></li>
              <li><a href="" class="fab fa-youtube"></a></li>
            </ul>
          </div>
        </div>
      </div>
    </footer>
    <a href="#body" id="backtotop">
      <i class="fas fa-chevron-circle-up"></i>
    </a>
  </body>
</html>
