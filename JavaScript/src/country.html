<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <style>
        .card-body{
            display: flex;
        }
        .col-2 img{
            height: 120px;
        }
        #neighbors .card{
            cursor: pointer;
        }
        .card-passive{
            display: none;
        }
        .card-passive.active{
            display: block;
        }
        #suggestions {
        border: 1px solid #ddd;
        border-top: none;
        max-height: 200px;
        overflow-y: auto;
        background: white;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        z-index: 1000;
        }
        #suggestions div {
            padding: 8px;
            cursor: pointer;
        }
        #suggestions div:hover {
            background: #f0f0f0;
        }
        #suggestions div img {
        flex-shrink: 0;
        }
        #loading{
            display: none;
            margin: 7px 10px 0 0;
            width: 1.5rem;
            height: 1.5rem;
        }
    </style>
    <title>Document</title>
</head>
<body>
    
   <div class="container my-5">
    <div id="errors"></div>
       <div class="card mb-3">
            <div class="card-body">
                <div id="loading" class="spinner-border text-warning" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <div class="input-group position-relative">
                    <input type="text" id="txtSearch" class="form-control" placeholder="Ülke ara...">
                    <button id="btnSearch" type="button" class="btn btn-danger">
                        <i class="fa-solid fa-location-crosshairs"></i>
                    </button>
                    <div id="suggestions"></div>
                </div>
            </div>    
        </div>
        <div class="card mb-3 card-passive" >
            <div class="card-header">Arama Sonucu</div>
            <div class="card-body">
                <div class="row" id="country-details"></div>
            </div>
        </div>
        <div class="card mb-3 card-passive" >
            <div class="card-header">Komşu Ülkeler</div>
            <div class="card-body">
                <div class="row" id="neighbors"></div>
            </div>
        </div>
        
   </div>

<script>
    let allCountries = [];
    // Tüm ülkeleri yükle
    window.addEventListener("DOMContentLoaded", () => {
        fetch("https://restcountries.com/v3.1/all?fields=name,flags,translations")
        .then(res => {
            if (!res.ok) throw new Error("Network response was not ok");
            return res.json();
        })
        .then(data => {
            // Her ülke için name + flag + translations objesi oluşturuyoruz
            allCountries = data.map(c => ({
                name: c.name.common,
                flag: c.flags.png,
                translations: Object.values(c.translations || {}).map(t => t.common)
            })).sort((a, b) => a.name.localeCompare(b.name));
        })
        .catch(error => {
            console.error("Fetch error:", error);
        });
    });

    // Inputa yazıldıkça filtrele
    document.querySelector("#txtSearch").addEventListener("input", function() {
        let query = this.value.toLowerCase();
        let suggestionsBox = document.querySelector("#suggestions");
        suggestionsBox.innerHTML = "";

        if (query.length === 0 || allCountries.length === 0) return;

        // name ve translations üzerinden filtreleme yap
        let matches = allCountries.filter(c =>
            c.name.toLowerCase().startsWith(query) ||
            c.translations.some(t => t.toLowerCase().startsWith(query))
        );

        matches.forEach(country => {
            let div = document.createElement("div");
            div.style.display = "flex";
            div.style.alignItems = "center";
            div.style.gap = "8px";

            div.innerHTML = `
                <img src="${country.flag}" alt="" style="width:20px; height:15px;">
                <span>${country.name}</span>
            `;

            div.addEventListener("click", function() {
                document.querySelector("#txtSearch").value = country.name;
                suggestionsBox.innerHTML = "";
                getCountry(country.name);
            });
            suggestionsBox.appendChild(div);
        });
    });

    // Inputa tıklayınca veya odaklanınca önerileri göster
    document.querySelector("#txtSearch").addEventListener("focus", function() {
        let suggestionsBox = document.querySelector("#suggestions");
        suggestionsBox.innerHTML = "";

        if (allCountries.length === 0) return;

        allCountries.forEach(country => {
            let div = document.createElement("div");
            div.style.display = "flex";
            div.style.alignItems = "center";
            div.style.gap = "8px";

            div.innerHTML = `
                <img src="${country.flag}" alt="" style="width:20px; height:15px;">
                <span>${country.name}</span>
            `;

            div.addEventListener("click", function() {
                document.querySelector("#txtSearch").value = country.name;
                suggestionsBox.innerHTML = "";
                getCountry(country.name);
            });

            suggestionsBox.appendChild(div);
        });
    });

    // Inputtan çıkınca önerileri gizle
    document.querySelector("#txtSearch").addEventListener("blur", function() {
        setTimeout(() => {
            document.querySelector("#suggestions").innerHTML = "";
        }, 200);
    });

    /* arama butonuna tıklama olayı
     document.querySelector("#btnSearch").addEventListener("click", () => {
         let text = document.querySelector("#txtSearch").value;
         getCountry(text);
     }); */

    // Enter tuşuna basınca arama yap
    document.querySelector("#txtSearch").addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            document.querySelector("#loading").style.display = "block";
            let text = this.value;
            getCountry(text);
        }
    });


    // konum butonuna tıklama olayı
    document.querySelector("#btnSearch").addEventListener("click", () => {
        document.querySelector("#txtSearch").value = "";
        document.querySelectorAll(".card-passive").forEach(card => card.classList.remove("active"));
        if(navigator.geolocation){
            document.querySelector("#loading").style.display = "block";
            navigator.geolocation.getCurrentPosition(onSuccess, onError);
        }
    });
    // konum alma hatası
    function onError(err){
        console.log(err);
        document.querySelector("#loading").style.display = "none";
    }
    // konum alma başarılı
    async function onSuccess(position){
        let lat = position.coords.latitude;
        let lng = position.coords.longitude;
        
        const api_key = "8f06cab3c1784495afb8f934f36b3da4 ";
        const url = `https://api.opencagedata.com/geocode/v1/json?q=${lat}+${lng}&key=${api_key}`;

        const response = await fetch(url);
        const data = await response.json();

        const country = data.results[0].components.country;

        // console.log(data);
        // console.log(country);

        document.querySelector("#txtSearch").value = country;
        getCountry(country);


    }


    // ülke bilgilerini yükleme
    async function getCountry(country) {
        try{
            const response = await fetch('https://restcountries.com/v3.1/name/' + country );
             if(!response.ok){
                throw  new Error("Ülke bulunamadı.")
             }
            const data = await response.json()
            renderCountry(data[0]);

            const countries = data[0].borders;
            if(!countries){
                throw new Error("Komşu ülke bulunamadı.");
            }
            const response2 = await fetch('https://restcountries.com/v3.1/alpha?codes=' + countries.toString());

            const neighbors = await response2.json();
            renderNeighbors(neighbors);
        }catch(err){
                renderError(err);
        }
       

        // fetch('https://restcountries.com/v3.1/name/' + country )
        // .then((response) =>  {
        //     // conmsole.log(response);
        //     if(!response.ok){
        //         throw  new Error("Ülke bulunamadı.")
        //     }
        //     return response.json();
        // })
        // .then ((data) => {
        //     renderCountry(data[0]);
        //     const countries = data[0].borders;

        //     if(!countries){
        //         throw new Error("Komşu ülke bulunamadı.");
        //     }
        //     return fetch('https://restcountries.com/v3.1/alpha?codes=' + countries );
        // })
        // .then(response => response.json())
        // .then(data =>renderNeighbors(data))
        // .catch(err => renderError(err));
       }

    // ülke bilgilerini gösterme
    function renderCountry(data) {
        document.querySelector("#loading").style.display = "none";
        document.querySelector("#neighbors").innerHTML = "";
                let html= `            
                   
                            <div class="col-4">
                                <img src="${data.flags.png}" alt="" class="img-fluid">
                            </div>
                            <div class="col-8">
                                <h3 class="card-title">${data.name.common} ( ${data.continents} )</h3>
                                <hr>
                                <div class="row">
                                    <div class="col-4"><b>Nüfus: </b></div>
                                    <div class="col-8">${(data.population / 1000000).toFixed(1)}</div>
                                </div>
                                <div class="row">
                                    <div class="col-4"><b>Resmi Dil: </b></div>
                                    <div class="col-8">${Object.values(data.languages)}</div>
                                </div>
                                <div class="row">
                                    <div class="col-4"><b>Başkent: </b></div>
                                    <div class="col-8">${data.capital[0]}</div>
                                </div>
                                <div class="row">
                                    <div class="col-4"><b>Para Birimi: </b></div>
                                    <div class="col-8">${Object.values(data.currencies)[0].name}  (${Object.values(data.currencies)[0].symbol})</div>
                                </div>
                            </div>
            `;

            document.querySelector("#country-details").innerHTML = html;
            document.querySelectorAll(".card-passive").forEach(card => card.classList.add("active"));
                            
        }

    // komşu ülkeleri gösterme
    function renderNeighbors(data){
            let html = "";
            for(let country of data){
                 html += `
                    <div class="col-2 mt-2">
                        <div class="card neighbor-card">
                            <img src="${country.flags.png}" class="card-img-top">
                            <div class="card-body">
                                <h6 class="card-title">${country.name.common}</h6>
                            </div>
                        </div>
                    </div>
                `;
            }
            document.querySelector("#neighbors").innerHTML = html;

            // Komşu ülke kartlarına tıklama olayı ekle
            document.querySelectorAll('.neighbor-card').forEach(card => {
                card.addEventListener('click', function() {
                    document.querySelector("#loading").style.display = "block";
                    const countryName = this.querySelector('.card-title').textContent;
                    document.querySelector('#txtSearch').value = countryName;
                    getCountry(countryName);
                });
            });
       }

    // Hata mesajını gösterme
    function renderError(err){
        document.querySelector("#loading").style.display = "none";
        const html = `
        <div class ="alert alert-danger">
            ${err.message}
        </div>`;
        setTimeout(function(){
            document.querySelector("#errors").innerHTML = "";
        },3000)
        document.querySelector("#errors").innerHTML = html;
    }
</script>
    

</body>
</html>
